<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soru Bankası - PDF Oluşturucu</title>
    
    <!-- Tailwind CSS (Arayüz tasarımı için) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2pdf.js (HTML'i PDF'e dönüştürmek için) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Google Fonts (İnter fontu için) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* PDF içerik alanı varsayılan olarak gizlidir, sadece PDF oluşturulurken kullanılır */
        #pdf-wrapper {
            position: absolute;
            left: -9999px;
            top: 0;
        }

        /* A4 Sayfa Stili */
        .a4-page {
            width: 210mm;
            height: 297mm;
            padding: 15mm;
            background-color: white;
            box-sizing: border-box;
            page-break-after: always;
        }

        /* Sayfa kırılmalarını düzgün ayarlamak için son sayfadaki boşluğu kaldıralım */
        .a4-page:last-child {
            page-break-after: auto;
        }

        /* Sayfa Başlığı Stili */
        .page-header {
            text-align: center;
            font-size: 16pt;
            font-weight: 700;
            margin-bottom: 8mm;
            height: 12mm;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111827;
        }

        /* 2x2 Izgara (Her sayfada 4 soru) */
        .questions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10mm;
            height: 237mm; /* Sabit boyut: Taşmayı engeller (297 - 30 padding - 20 header) */
        }

        /* Tekil Soru Bloğu Tasarımı */
        .question-block {
            display: flex;
            flex-direction: column;
            border: 1px solid #e5e7eb;
            padding: 12px;
            border-radius: 8px;
            overflow: hidden;
            height: 100%;
            box-sizing: border-box;
        }

        .q-text {
            font-size: 11pt;
            font-weight: 700;
            margin-bottom: 8px;
            color: #111827;
            line-height: 1.4;
        }

        .q-options {
            font-size: 10pt;
            margin-bottom: 12px;
            color: #374151;
            line-height: 1.5;
        }

        /* Açıklama Stili */
        .q-explanation {
            font-size: 9pt;
            color: #4b5563;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px dashed #e5e7eb;
            line-height: 1.4;
        }

        /* Mesaj Kutusu Animasyonu */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 0.3s ease-out;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        
        <!-- Üst Başlık -->
        <div class="bg-blue-600 px-6 py-4">
            <h1 class="text-2xl font-bold text-white">Soru Bankası PDF Oluşturucu</h1>
            <p class="text-blue-100 text-sm mt-1">Metin (CSV/TSV) formatındaki sorularınızı hızlıca A4 PDF'e dönüştürün.</p>
        </div>

        <!-- Ana İçerik -->
        <div class="p-4 md:p-8">
            
            <div class="mb-6">
                <label for="csvInput" class="block text-sm font-medium text-gray-700 mb-2">Başlık ve Soruları Buraya Yapıştırın (İlk satır başlık, sonraki satırlar soru):</label>
                <textarea id="csvInput" rows="12" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y" placeholder="Konu Başlığı (Örn: Hepatit C)&#10;1. Soru metni | A şıkkı | B şıkkı | C şıkkı | D şıkkı | E şıkkı | Açıklama metni&#10;..."></textarea>
            </div>

            <!-- Kontrol Butonları -->
            <div class="flex flex-col-reverse sm:flex-row items-center justify-between gap-4">
                <button onclick="clearTextarea()" class="text-gray-500 hover:text-red-500 font-medium text-sm transition-colors w-full sm:w-auto py-2">
                    İçeriği Temizle
                </button>
                <button onclick="generatePDF()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center w-full sm:w-auto">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    PDF Oluştur (2 Sayfa / 8 Soru)
                </button>
            </div>

        </div>
    </div>

    <!-- Özel Uyarı Mesajı Kutusu (Alert yerine geçer) -->
    <div id="toast-message" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-xl toast-enter" style="display: none; z-index: 50;">
        <span id="toast-text">Mesaj burada yer alacak.</span>
    </div>

    <!-- Bu alan ekranda görünmez, sadece PDF'e basılacak HTML yapısını tutar -->
    <div id="pdf-wrapper">
        <div id="pdf-content">
            <!-- JavaScript ile sayfalar ve sorular buraya dinamik olarak eklenecek -->
        </div>
    </div>

    <script>
        /**
         * Ekranda özel bir uyarı (toast) mesajı gösterir (alert yerine).
         */
        function showMessage(message, isError = false) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            
            toastText.textContent = message;
            toast.style.backgroundColor = isError ? '#ef4444' : '#10b981'; // Kırmızı (Hata) veya Yeşil (Başarı)
            
            toast.style.display = 'block';
            // Animasyon için frame bekle
            requestAnimationFrame(() => {
                toast.classList.add('toast-enter-active');
                toast.classList.remove('toast-enter');
            });

            // 3 saniye sonra gizle
            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-enter');
                setTimeout(() => { toast.style.display = 'none'; }, 300);
            }, 3000);
        }

        /**
         * Textarea içeriğini temizler
         */
        function clearTextarea() {
            document.getElementById('csvInput').value = '';
            showMessage('Metin alanı temizlendi.');
        }

        /**
         * Textarea'daki metni ayrıştırır.
         * İlk satırı başlık olarak alır.
         */
        function parseInput(text) {
            const lines = text.split('\n').filter(line => line.trim() !== ''); // Boş satırları atla
            
            if (lines.length === 0) {
                return { title: 'Soru Bankası', questions: [] };
            }

            const title = lines[0].trim(); // İlk satır her zaman başlık
            const questions = [];

            for (let i = 1; i < lines.length; i++) { // 1. indexten itibaren sorular başlar
                const line = lines[i].trim();

                // Önce TAB ile ayırmayı dene (Excel formatı)
                let parts = line.split('\t');
                
                // Yeterli değilse Pipe (|) ile ayır
                if (parts.length < 2) {
                    parts = line.split('|');
                }

                parts = parts.map(p => p.trim());

                // En az Soru + 5 Şık = 6 parça olmalı
                if (parts.length >= 6) {
                    questions.push({
                        q: parts[0],
                        a: parts[1],
                        b: parts[2],
                        c: parts[3],
                        d: parts[4],
                        e: parts[5],
                        exp: parts[6] || '' // 7. parça açıklama (varsa)
                    });
                } else {
                    console.warn(`${i + 1}. satır uygun formatta değil, atlanıyor. İçerik:`, line);
                }
            }
            return { title, questions };
        }

        /**
         * Ana PDF oluşturma fonksiyonu
         */
        function generatePDF() {
            const rawText = document.getElementById('csvInput').value;
            
            if (!rawText.trim()) {
                showMessage("Lütfen önce metin kutusuna başlık ve sorularınızı yapıştırın!", true);
                return;
            }

            const parsedData = parseInput(rawText);
            const topicTitle = parsedData.title;
            // En fazla 8 soru olacak şekilde sınırla (Maks 2 sayfa)
            const questions = parsedData.questions.slice(0, 8);

            if (questions.length === 0) {
                showMessage("Uygun formatta soru bulunamadı. Lütfen ayraçları kontrol edin (Tab veya | ).", true);
                return;
            }

            showMessage("PDF Hazırlanıyor, lütfen bekleyin...");

            const pdfContent = document.getElementById('pdf-content');
            pdfContent.innerHTML = ''; // Eski içeriği temizle

            // Soruları 4'erli gruplara ayır
            const QUESTIONS_PER_PAGE = 4;
            
            for (let i = 0; i < questions.length; i += QUESTIONS_PER_PAGE) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'page-header';
                headerDiv.textContent = topicTitle;
                pageDiv.appendChild(headerDiv);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'questions-grid';

                const pageQuestions = questions.slice(i, i + QUESTIONS_PER_PAGE);

                pageQuestions.forEach(qData => {
                    const questionBlock = document.createElement('div');
                    questionBlock.className = 'question-block';

                    // Açıklama kısmı boş değilse göster, boşsa gizle
                    const expHtml = qData.exp 
                        ? `<div class="q-explanation"><strong>Açıklama:</strong><br>${escapeHTML(qData.exp).replace(/\n/g, '<br>')}</div>` 
                        : '';

                    questionBlock.innerHTML = `
                        <div class="q-text">${escapeHTML(qData.q)}</div>
                        <div class="q-options">
                            <div>A) ${escapeHTML(qData.a)}</div>
                            <div>B) ${escapeHTML(qData.b)}</div>
                            <div>C) ${escapeHTML(qData.c)}</div>
                            <div>D) ${escapeHTML(qData.d)}</div>
                            <div>E) ${escapeHTML(qData.e)}</div>
                        </div>
                        ${expHtml}
                    `;
                    gridDiv.appendChild(questionBlock);
                });

                pageDiv.appendChild(gridDiv);
                pdfContent.appendChild(pageDiv);
            }

            // windowWidth: 1024 ayarı telefonlardan girildiğinde A4 düzeninin bozulmasını engeller.
            const opt = {
                margin:       0,
                filename:     `${topicTitle.replace(/[^a-z0-9şğüöçıİ]/gi, '_').toLowerCase() || 'soru_bankasi'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true, windowWidth: 1024 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Gizli elementi şeffaf bir şekilde öne alıyoruz ki PDF'e düzgün basılsın (Bazı tarayıcılarda görünmez elementi atlar)
            const wrapper = document.getElementById('pdf-wrapper');
            wrapper.style.left = '0';
            wrapper.style.zIndex = '-999';
            wrapper.style.opacity = '0.01';

            html2pdf().set(opt).from(pdfContent).save().then(() => {
                showMessage("PDF başarıyla indirildi!");
                // İşlem bitince tekrar gizle
                wrapper.style.left = '-9999px';
                wrapper.style.opacity = '1';
            }).catch(err => {
                showMessage("PDF oluşturulurken bir hata meydana geldi.", true);
                console.error(err);
                // Hataya düşse bile görünmez yap
                wrapper.style.left = '-9999px';
                wrapper.style.opacity = '1';
            });
        }

        /**
         * HTML etiketlerini zararsız hale getiren yardımcı fonksiyon
         */
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
</html>
